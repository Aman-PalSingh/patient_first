server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: patient_service_route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/patients,/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: api_docs_patient_root
              uri: http://patient-service:4000
              predicates:
                - Path=/api_docs/patients
              filters:
                - RewritePath=/api_docs/patients,/v3/api-docs

            - id: auth_service_route
              uri: http://auth-service:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: api_docs_auth_root
              uri: http://auth-service:4005
              predicates:
                - Path=/api_docs/auth
              filters:
                - RewritePath=/api_docs/auth,/v3/api-docs


