  services:
    patient_service:
      build:
        context: ./patient_service
        dockerfile: Dockerfile
      image: patient-service:latest
      container_name: patient_service

      ports:
        - "4000:4000"

      environment:
        SPRING_DATASOURCE_PASSWORD: password
        SPRING_DATASOURCE_URL: jdbc:postgresql://patient_service_db:5432/db
        SPRING_DATASOURCE_USERNAME: admin_user
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_SQL_INIT_MODE: always
        BILLING_SERVICE_ADDRESS: billing-service
        BILLING_SERVICE_GRPC_PORT: 9001

      depends_on:
        - patient_service_db

      networks:
        - internal

    kafka:
      image: apache/kafka:latest
      container_name: kafka
      ports:
        - "9092:9092"
        - "9094:9094"
      environment:
        KAFKA_NODE_ID: 0
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

        KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      networks:
        - internal

    patient_service_db:
      image: postgres:15
      container_name: patient_service_db

      environment:
        POSTGRES_USER: admin_user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: db

      ports:
        - "5000:5432"

      volumes:
        - patient_db_data:/var/lib/postgresql/data

      networks:
        - internal

      restart: unless-stopped
    billing-service:
      build:
        context: ./billing_service
        dockerfile: Dockerfile
      image: billing_service:latest
      container_name: billing_service

      ports:
        - "4001:4001"
        - "9001:9001"
      networks:
        - internal

  volumes:
    patient_db_data:

  networks:
    internal: