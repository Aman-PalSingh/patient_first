services:
  patient-service:
    build:
      context: ./patient_service
      dockerfile: Dockerfile
    image: patient-service:latest
    container_name: patient-service

    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      - patient-service-db

    networks:
      - internal

  analytics-service:
    build:
      context: ./analytics_service
      dockerfile: Dockerfile
    image: analytics-service:latest
    container_name: analytics-service

    ports:
      - "4002:4002"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - internal

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    image: api-gateway:latest
    container_name: api-gateway

    ports:
      - "4004:4004"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
    depends_on:
      - patient-service

    networks:
      - internal

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - internal

  patient-service-db:
    image: postgres:15
    container_name: patient-service-db

    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db

    ports:
      - "5000:5432"

    volumes:
      - patient_db_data:/var/lib/postgresql/data

    networks:
      - internal

    restart: unless-stopped

  auth-service-db:
    image: postgres:15
    container_name: auth-service-db

    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db

    ports:
      - "5001:5432"

    volumes:
      - auth_db_data:/var/lib/postgresql/data

    networks:
      - internal

    restart: unless-stopped

  billing-service:
    build:
      context: ./billing_service
      dockerfile: Dockerfile
    image: billing-service:latest
    container_name: billing-service

    ports:
      - "4001:4001"
      - "9001:9001"

    networks:
      - internal

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: auth-service

    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: 4aYkx5W5TXcTXZnhmChH2UIEHV83cJMfrdH9hkOsa7s

    depends_on:
      - auth-service-db

    networks:
      - internal

volumes:
  patient_db_data:
  auth_db_data:

networks:
  internal: